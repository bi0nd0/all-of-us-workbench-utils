[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "all-of-us-workbench-utils"
version = "0.2.0"
description = "Reproducible cohort extraction, matching and analysis for All of Us Workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Francesco Delacqua"}]
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "pydantic>=2.9,<3", "PyYAML>=6,<7",
  "scipy>=1.13,<2", "statsmodels>=0.14.4,<0.15", "google-cloud-bigquery>=3.25,<4",
  "db-dtypes>=1.3,<2", "pyarrow>=17,<24", "XlsxWriter>=3.2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "build>=1.2,<2", "ruff>=0.12,<1"]

[project.scripts]
aou-studies = "aou_studies.cli:main"

[project.urls]
Repository = "https://github.com/bi0nd0/all-of-us-workbench-utils"

[tool.hatch.build.targets.wheel]
packages = ["src/aou_studies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["r: requires the documented R engines", "cloud: requires an authorized Workbench context"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
